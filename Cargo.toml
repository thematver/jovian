[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui", "crates/plugin", "xtask"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
