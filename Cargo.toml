[workspace]
resolver = "2"
exclude = ["vendor"]
members = ["crates/core", "crates/cli", "crates/gui", "crates/plugin", "xtask"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# nih-plug with a fix for loading damaged CLAP state (see vendor/nih-plug, "Jovian-8:" comments)
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih-plug" }
nih_plug_derive = { path = "vendor/nih-plug/nih_plug_derive" }
nih_plug_xtask = { path = "vendor/nih-plug/nih_plug_xtask" }
