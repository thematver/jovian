[package]
name = "jovian-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jovian-8 as CLAP, VST3 and (through clap-wrapper) AUv2"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
jovian-core = { path = "../core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
parking_lot = "0.12"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jovian-gui = { path = "../gui" }
tiny-skia = "=0.11.4"
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
softbuffer = { version = "0.4", default-features = false }
raw-window-handle = "0.5"
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6" }
keyboard-types = { version = "0.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
